[project]
name = "opennyai"
version = "0.0.14"
description = "A SpaCy pipeline and models for NLP on Indian legal text."
authors = [{ name = "OpenNyAI Team", email = "aman.tiwari@thoughtworks.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
keywords = [
    "law",
    "indianlegalner",
    "legalner",
    "legal",
    "ner",
    "lawtech",
    "legaltech",
    "nlp",
    "spacy",
    "rhetorical role",
    "summarizer",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.48",
    "pytorch-transformers>=1.2",
    "multiprocess>=0.70",
    "numpy>=2.2",
    "pandas>=2.2",
    "spacy>=3.8",
    "spacy-transformers>=1.3",
    "beautifulsoup4>=4.12",
    "requests>=2.32",
    "nltk>=3.9",
    "tqdm>=4.67",
    "prettytable>=3.12",
    "scikit-learn>=1.6",
    "Levenshtein>=0.26",
    "wasabi>=1.1",
    "spacy-curated-transformers>=0.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
